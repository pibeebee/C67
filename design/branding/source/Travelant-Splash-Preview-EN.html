const tt=u=>0.5+u*1.6, L=EZ.LIN, finT=4.65, antT=3.4, waveT=4.05, pulseT=2.65;
const T={
 icon:[[0,.92],[.6,1,EZ.GEN]],

 trim:S.map(([u,f],i)=>[tt(u),f,i?L:null]),
 pinOp:[[.3,0],[.4,1,EZ.EO]],
 pinX:[...S.map(([u,f,x],i)=>[tt(u),x,i?L:null]),[2.55,0,EZ.EIO]],
 pinY:[...S.map(([u,f,x,y],i)=>[tt(u),y,i?L:null]),[2.32,-25,EZ.EO],[2.55,0,EZ.EI]],
 pinS:[[.3,.001],[.5,.6,SPR(.4)],[2.1,.6],[2.6,1,SPR(.5)],[pulseT,1],[pulseT+.12,1.14,EZ.EO],[pulseT+.28,1,EZ.EIO],[pulseT+.4,1.14,EZ.EO],[pulseT+.58,1,EZ.EIO]],
 fin:[[finT,0],[finT+.15,1,EZ.EO]],
};
const rip=(a,b)=>({s:[[a,1],[b,2.9,EZ.EO]],o:[[a-.01,0],[a+.06,.9,EZ.EO],[b,0,EZ.EO]]});
T.r1=rip(pulseT+.02,pulseT+.75);T.r2=rip(pulseT+.42,pulseT+1.1);
const ant=(d,rot,sg)=>{const s=antT+d,w=waveT+d;return{s:[[s,.001],[s+.5,1,SPR(.5)]],o:[[s,0],[s+.08,1,EZ.EO],[finT+.15,1],[finT+.25,0,L]],

// ---------- text ----------
const word=document.getElementById('word'),tag=document.getElementById('tag');
const W='Travelant',TAG='Your fun travel companion';
word.innerHTML=[...W].map(c=>`<span>${c}</span>`).join('');

const wch=[...word.children],tws=[...tag.children];
const TXT0=4.45, STG=.055, TAG0=5.05;

const $=id=>document.getElementById(id);
const PIV={L:[1176,1166],R:[1316,1166]};
function render(t){
 const s=ev(T.icon,t);$('iconScale').setAttribute('transform',`translate(220 220) scale(${s}) translate(-220 -220)`);
 const r=$('route');r.style.opacity=ev(T.routeOp,t);const e=Math.max(0,Math.min(1,ev(T.trim,t)));r.setAttribute('stroke-dasharray',`${e} 2`);
 $('fin').style.opacity=ev(T.fin,t);
 for(const [id,k,p] of [['antL','aL',PIV.L],['antR','aR',PIV.R]]){const a=T[k];const sc=Math.max(.001,ev(a.s,t));

 for(const id of ['r1','r2']){const a=T[id];const sc=ev(a.s,t);$(id).setAttribute('transform',`translate(221.8 224.6) scale(${sc}) translate(-221.8 -224.6)`);$(id).setAttribute('stroke-width',3/sc);$(id).style.opacity=ev(a.o,t);}

 // wordmark: per-letter spring pop with tilt + blur, then a light sweep
 wch.forEach((el,i)=>{const t0=TXT0+i*STG,u=Math.max(0,Math.min(1,(t-t0)/.62));const sp=SPR(.45)(u),fo=EZ.EO(Math.min(1,u*2.2));
  const rot=(i%2?1:-1)*14*(1-sp),y=26*(1-sp),sc=.35+.65*sp;el.style.opacity=fo;el.style.filter=`blur(${(1-fo)*6}px)`;
  el.style.transform=`translateY(${y}px) rotate(${rot}deg) scale(${sc})`;});
 wch.forEach((el,i)=>{const g=Math.max(0,Math.min(1,(t-(5.5+i*.05))/.36)),k=Math.sin(Math.PI*g);
  if(g>0&&g<1){const c=[255,255-29*k,255-72*k];el.style.color=`rgb(${c[0]},${c[1]|0},${c[2]|0})`;el.style.transform+=` translateY(${-5*k}px)`;}else el.style.color='#fff';});
 tws.forEach((el,i)=>{const t0=TAG0+i*.09,u=Math.max(0,Math.min(1,(t-t0)/.5));const f=EZ.EO(u);el.style.opacity=f;el.style.filter=`blur(${(1-f)*5}px)`;el.style.transform=`translateY(${10*(1-f)}px)`;});
}
window.render=render;window.DUR=6.4;

if(!location.search.includes('static')){let st=null;const loop=ts=>{if(st===null)st=ts;let t=((ts-st)/1000)%(DUR+0.8);render(Math.min(t,DUR));requestAnimationFrame(loop)};requestAnimationFrame(loop);}else render(0);
</script></body></html>
