name: C67
configs:
  Debug: debug
  Staging: release
  Release: release
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "18.0"
packages:
  C67Backend:
    path: ../../packages/C67Backend
  PocketEngine:
    path: ../../packages/PocketEngine
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.pibeebee.c67.starter
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DP5XP7C2AM
targets:
  C67:
    type: application
    platform: iOS
    settings:
      base:
        DEVELOPMENT_ASSET_PATHS: '"Resources/ItineraryPreview.xcassets" "../../contracts/fixtures/rundowns.json" "../../contracts/fixtures/planning-input.json"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
    sources:
      - App
      - Features
      - Shared
      - Resources
      - path: ../../contracts/fixtures/rundowns.json
        buildPhase: resources
      - path: ../../contracts/fixtures/planning-input.json
        buildPhase: resources
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.pibeebee.c67.auth
            CFBundleURLSchemes: [c67]
        C67_DATA_MODE: $(C67_DATA_MODE)
        C67_APP_MODE: $(C67_APP_MODE)
        TRAVELANTS_REVIEW_EMAILS: $(TRAVELANTS_REVIEW_EMAILS)
        TRAVELANTS_PRIVACY_POLICY_URL: $(TRAVELANTS_PRIVACY_POLICY_URL)
        TRAVELANTS_AI_RECIPIENT: $(TRAVELANTS_AI_RECIPIENT)
        TRAVELANTS_AI_DISCLOSURE_VERSION: $(TRAVELANTS_AI_DISCLOSURE_VERSION)
        SUPABASE_URL: $(SUPABASE_SCHEME)://$(SUPABASE_HOST)
        SUPABASE_CLIENT_KEY: $(SUPABASE_CLIENT_KEY)
        PLANNING_API_URL: $(PLANNING_SCHEME)://$(PLANNING_HOST)
        POCKET_SERVER_URL: $(POCKET_SERVER_SCHEME)://$(POCKET_SERVER_HOST)
        CFBundleDisplayName: Travelants
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Travelants uses your location to find places near your starting point and detect arrival during an active trip.
        UILaunchScreen:
          UIColorName: TripCanvas
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    attributes:
      SystemCapabilities:
        com.apple.SignInWithApple:
          enabled: 1
        com.apple.WeatherKit:
          enabled: 1
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Staging: Configuration/Staging.xcconfig
      Release: Configuration/Release.xcconfig
    dependencies:
      - package: C67Backend
        product: C67Domain
      - package: C67Backend
        product: C67Data
  C67AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    dependencies:
      - target: C67
      - package: C67Backend
        product: C67Domain
      - package: C67Backend
        product: C67Data
      - package: PocketEngine
        product: PocketEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pibeebee.c67.starter.apptests
  C67UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: C67
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pibeebee.c67.starter.uitests
schemes:
  C67:
    build:
      targets:
        C67: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - C67AppTests
        - C67UITests
  C67 Staging:
    build:
      targets:
        C67: all
    # Run and SwiftUI previews need an unoptimised Debug build; the launch argument switches it to
    # staging behaviour. Archive (TestFlight) uses the real Staging configuration.
    run:
      config: Debug
      commandLineArguments:
        "-C67_APP_MODE staging": true
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
