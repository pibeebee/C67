name: c67-media
services:
  worker:
    image: c67-media:${C67_MEDIA_REVISION:?Set a reviewed Git revision}
    build:
      context: ../workers/media
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    env_file: ./media-worker.env
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/c67-media-heartbeat','utf8'))<180000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
