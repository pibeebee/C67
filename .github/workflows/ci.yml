name: Integration checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify promotion policy
        run: |
          python3 -m unittest discover -s scripts -p 'test_integration_policy.py'
          python3 scripts/check_integration_policy.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Validate contracts and fixtures
        run: |
          python3 scripts/check_contracts.py
          python3 -m unittest discover -s server/pocket/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/planning/package-lock.json
      - run: npm ci --prefix server/planning --ignore-scripts
      - name: Planning type, format and isolated unit checks
        run: |
          npm run check --prefix server/planning
          npm run format:check --prefix server/planning
          npm test --prefix server/planning
  ios-smoke:
    needs: integration
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Swift format and shared package tests
        run: |
          python3 scripts/swift_format.py --check
          swift test --package-path packages/C67Backend
      - name: App unit tests and two critical UI flows
        shell: bash
        run: |
          set -o pipefail
          destination=$(python3 scripts/simulator_destination.py)
          xcodebuild -version
          echo "Simulator destination: $destination"
          xcodebuild -project apps/ios/C67.xcodeproj -scheme C67 \
            -destination "$destination" -derivedDataPath "$RUNNER_TEMP/c67-smoke" \
            -resultBundlePath "$RUNNER_TEMP/ios-smoke.xcresult" \
            -only-testing:C67AppTests \
            -only-testing:C67UITests/TripHomeUITests/testEmptyHomeNavigationAndPlanningEntry \
            -only-testing:C67UITests/TripHomeUITests/testSavingMockProposalOpensTripAndReturnsHome \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- C67_DATA_MODE=mock test \
            | tee "$RUNNER_TEMP/ios-smoke.log"
      - name: Preserve failed smoke evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-smoke.xcresult
            ${{ runner.temp }}/ios-smoke.log
          retention-days: 3
