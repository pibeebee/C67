name: C67LocalServerHarness
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: DP5XP7C2AM
    MARKETING_VERSION: '0.2'
    CURRENT_PROJECT_VERSION: '4'
packages:
  Lab:
    path: ..
  TripIntegration:
    path: ../../c67-trip-integration/Packages/TripIntegration
  PreferenceQuality:
    path: ../../c67-foundation-lab/Packages/PreferenceQuality
targets:
  C67LocalServerHarness:
    type: application
    platform: iOS
    sources:
      - HarnessApp.swift
      - ../Sources/PlannerBenchCLI/OriginalDriver.swift
      - ../Sources/PlannerBenchCLI/OriginalIntegrationModel.swift
    resources:
      - path: RunConfig.json
        optional: true
    dependencies:
      - package: Lab
        product: PlannerContracts
      - package: TripIntegration
      - package: PreferenceQuality
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-trip-integration
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Harness.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: C67 Server Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the temporary itinerary benchmark server on your Mac.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  C67LocalServerHarness:
    build:
      targets:
        C67LocalServerHarness: all
