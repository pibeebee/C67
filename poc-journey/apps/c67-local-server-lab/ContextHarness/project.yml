name: C67ContextLab
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: DP5XP7C2AM
    MARKETING_VERSION: '0.5'
    CURRENT_PROJECT_VERSION: '5'
packages:
  Lab:
    path: ..
  PreferenceLearning:
    path: ../../c67-foundation-lab/Packages/PreferenceLearning
targets:
  C67ContextLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: RunConfig.json
        buildPhase: resources
    dependencies:
      - package: Lab
        product: DynamicTripContracts
      - package: Lab
        product: PlaceContextEngine
      - package: Lab
        product: RecommendationContracts
      - package: PreferenceLearning
        product: PreferenceLearning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-context-lab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: C67 Context Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your local itinerary context lab.
        TARGETED_DEVICE_FAMILY: '1,2'
  ContextLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: C67ContextLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-context-lab-uitests
        TEST_TARGET_NAME: C67ContextLab
schemes:
  C67ContextLab:
    build:
      targets:
        C67ContextLab: all
    test:
      targets:
        - ContextLabUITests
      gatherCoverageData: false
