name: C67PreferenceLab
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: DP5XP7C2AM
    MARKETING_VERSION: '0.3'
    CURRENT_PROJECT_VERSION: '3'
packages:
  Core:
    path: ..
  PreferenceLearning:
    path: ../../c67-foundation-lab/Packages/PreferenceLearning
targets:
  C67PreferenceLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: RunConfig.json
        buildPhase: resources
    dependencies:
      - package: Core
        product: PreferenceCore
      - package: PreferenceLearning
        product: PreferenceLearning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-preference-lab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: C67 Preference Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  PreferenceLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: C67PreferenceLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-preference-lab-uitests
        TEST_TARGET_NAME: C67PreferenceLab
schemes:
  C67PreferenceLab:
    build:
      targets:
        C67PreferenceLab: all
    test:
      targets:
        - PreferenceLabUITests
      gatherCoverageData: false
