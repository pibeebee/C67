name: C67PocketEngineLab
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: DP5XP7C2AM
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
packages:
  Pocket:
    path: ..
targets:
  C67PocketEngineLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Pocket
        product: PocketEngine
    entitlements:
      path: PocketEngine.entitlements
      properties:
        com.apple.developer.maps: true
        com.apple.developer.weatherkit: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: C67 Pocket Engine
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Gunakan lokasi Anda sebagai titik awal perjalanan saat diminta.
        NSLocalNetworkUsageDescription: Mengunduh katalog tempat dari server Pocket Engine milik Anda.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-pocket-engine-lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  C67PocketEngineLab:
    build:
      targets:
        C67PocketEngineLab: all
