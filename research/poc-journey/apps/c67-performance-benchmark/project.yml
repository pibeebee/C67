name: C67PerformanceBenchmark
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: DP5XP7C2AM
    MARKETING_VERSION: '0.2'
    CURRENT_PROJECT_VERSION: '4'
packages:
  TripIntegration:
    path: ../c67-trip-integration/Packages/TripIntegration
  PreferenceQuality:
    path: ../c67-foundation-lab/Packages/PreferenceQuality
targets:
  C67PerformanceBenchmark:
    type: application
    platform: iOS
    sources: [Benchmark.swift, BenchmarkApp.swift, OriginalIntegrationModel.swift]
    dependencies:
      - package: TripIntegration
      - package: PreferenceQuality
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: giovanchristoffel.c67-trip-integration
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: C67 Performance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: Benchmark.entitlements
schemes:
  C67PerformanceBenchmark:
    build:
      targets:
        C67PerformanceBenchmark: all
